name: Secure CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.control }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        control: [lint, tests, sast, secrets, sca]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run control
        run: bash ci/check.sh "${{ matrix.control }}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ matrix.control }}
          path: reports/
          if-no-files-found: ignore

  package:
    name: package
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Empaquetar código aprobado
        run: |
          mkdir -p dist
          zip -r dist/cloud-forge.zip app requirements.txt

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: codigo-aprobado
          path: dist/cloud-forge.zip
